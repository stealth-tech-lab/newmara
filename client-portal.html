<meta charset="UTF-8">

<link rel="canonical" href="https://newmara.com/client-portal.html">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg">
</head>
<body class="portal-body portal-login-only">
<header class="nav">
  <div class="container nav-inner">
    <a href="/" class="brand">
      <div class="brand-mark">N</div>
      <div class="brand-copy"><strong>NEWMARA</strong><span>Private Investments</span></div>
    </a>
    <nav class="nav-links">
      <a href="/private-equity.html" class="">Private Equity</a>
<a href="/real-estate.html" class="">Real Estate</a>
<a href="/portfolio.html" class="">Portfolio</a>
<a href="/investors.html" class="">Investors</a>
<a href="/about.html" class="active">About</a>
      <a class="nav-cta" href="/contact.html">Contact</a>
    </nav>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">☰</button>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <div class="container">
      <a href="/private-equity.html">Private Equity</a>
<a href="/real-estate.html">Real Estate</a>
<a href="/portfolio.html">Portfolio</a>
<a href="/investors.html">Investors</a>
<a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
    </div>
  </div>
</header>
<main class="portal-login-stage">
  <div class="portal-login-card">
    <div class="portal-login-brand">
      <div class="portal-login-mark">N</div>
      <div class="portal-login-name">NEWMARA</div>
    </div>

    <div class="portal-login-copy">
      <div class="portal-login-eyebrow">CLIENT PORTAL</div>
      <h1>Sign in</h1>
    </div>

    <form class="portal-login-form" onsubmit="event.preventDefault(); document.getElementById('portalMsg').style.display='block';">
      <label>Email
        <input type="email" autocomplete="username" placeholder="name@company.com" required>
      </label>

      <label>Password
        <input type="password" autocomplete="current-password" placeholder="••••••••••••" required>
      </label>

      <div class="portal-login-row">
        <label class="portal-remember"><input type="checkbox"> Remember me</label>
        <a href="#" onclick="event.preventDefault()">Forgot password?</a>
      </div>

      <button class="portal-login-button" type="submit">Continue</button>

      <div class="portal-two-factor">
        <span class="portal-two-factor-icon">✓</span>
        <span>Protected by two-factor authentication</span>
      </div>

      <div id="portalMsg" class="portal-login-message">
        Secure portal access is not yet connected.
      </div>
    </form>
  </div>
</main>
<script src="/site.js"></script>
</body>
</html>
